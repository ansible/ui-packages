name: Bug report
description: Report a problem with one of the packages in this repository.
title: "[Bug]: "
body:
  - type: input
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      placeholder: "@ansible/package-name"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest example that reproduces the issue.
    validations:
      required: true
