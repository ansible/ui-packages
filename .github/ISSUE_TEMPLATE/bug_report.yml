name: Bug report
description: Report a problem with a package in this workspace.
title: '[Bug]: '
body:
  - type: input
    id: package
    attributes:
      label: Package
      description: Which package is affected?
      placeholder: '@ansible/package-name'
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which package version and Node.js version are you using?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the smallest useful reproduction.
    validations:
      required: true
