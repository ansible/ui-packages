name: Changesets

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}

jobs:
  version:
    name: Changeset version pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Dependencies
        run: npm ci --ignore-scripts

      - name: Select Changesets mode
        id: mode
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

      - name: Create or update version pull request
        if: steps.mode.outputs.mode == 'version'
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          script: npm run changesets:version
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
          push-with-git-cli: false
