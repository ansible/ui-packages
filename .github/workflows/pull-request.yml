name: Pull Request

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: npm ci --ignore-scripts
      - run: npm run static
      - name: Check workflow security
        run: uvx zizmor==1.30.1 .github/workflows
      - name: Check workflow syntax
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$GOBIN/actionlint" .github/workflows/*.yml

  build:
    name: Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.23.4', '24.x']
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Validate package type exports
        run: npm run attw

  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.23.4', '24.x']
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  required-checks:
    name: Gate
    if: always()
    needs: [static-analysis, build, test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Verify required jobs succeeded
        env:
          STATIC_ANALYSIS_RESULT: ${{ needs.static-analysis.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          set -euo pipefail
          if [[ "$STATIC_ANALYSIS_RESULT" != "success" || "$BUILD_RESULT" != "success" || "$TEST_RESULT" != "success" ]]; then
            echo "Required jobs must all succeed (static-analysis=$STATIC_ANALYSIS_RESULT, build=$BUILD_RESULT, test=$TEST_RESULT)."
            exit 1
          fi
